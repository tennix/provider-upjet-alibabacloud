apiVersion: natgateway.alibabacloud.crossplane.io/v1alpha1
kind: ForwardEntry
metadata:
  annotations:
    meta.upbound.io/example-id: natgateway/v1alpha1/forwardentry
  labels:
    testing.upbound.io/example-name: default
  name: default
spec:
  forProvider:
    externalIpSelector:
      matchLabels:
        testing.upbound.io/example-name: default
    externalPort: "80"
    forwardEntryName: ${var.name}
    forwardTableIdSelector:
      matchLabels:
        testing.upbound.io/example-name: default
    internalIp: 172.16.0.115
    internalPort: "8080"
    ipProtocol: tcp
    region: cn-beijing

---

apiVersion: natgateway.alibabacloud.crossplane.io/v1alpha1
kind: NATGateway
metadata:
  annotations:
    meta.upbound.io/example-id: natgateway/v1alpha1/forwardentry
  labels:
    testing.upbound.io/example-name: default
  name: default
spec:
  forProvider:
    natGatewayName: ${var.name}
    natType: Enhanced
    networkType: intranet
    region: cn-beijing
    vpcIdSelector:
      matchLabels:
        testing.upbound.io/example-name: default
    vswitchIdSelector:
      matchLabels:
        testing.upbound.io/example-name: default

---

apiVersion: vpc.alibabacloud.crossplane.io/v1alpha1
kind: VPC
metadata:
  annotations:
    meta.upbound.io/example-id: natgateway/v1alpha1/forwardentry
  labels:
    testing.upbound.io/example-name: default
  name: default
spec:
  forProvider:
    cidrBlock: 172.16.0.0/12
    region: cn-beijing
    vpcName: ${var.name}

---

apiVersion: natgateway.alibabacloud.crossplane.io/v1alpha1
kind: VPCNATIP
metadata:
  annotations:
    meta.upbound.io/example-id: natgateway/v1alpha1/forwardentry
  labels:
    testing.upbound.io/example-name: default
  name: default
spec:
  forProvider:
    natGatewayIdSelector:
      matchLabels:
        testing.upbound.io/example-name: default
    natIp: 172.16.0.66
    natIpCidr: 172.16.0.0/21
    natIpName: ${var.name}
    region: cn-beijing

---

apiVersion: vpc.alibabacloud.crossplane.io/v1alpha1
kind: Vswitch
metadata:
  annotations:
    meta.upbound.io/example-id: natgateway/v1alpha1/forwardentry
  labels:
    testing.upbound.io/example-name: default
  name: default
spec:
  forProvider:
    cidrBlock: 172.16.0.0/21
    region: cn-beijing
    vpcIdSelector:
      matchLabels:
        testing.upbound.io/example-name: default
    vswitchName: ${var.name}
    zoneId: ${data.alicloud_zones.default.zones.0.id}
