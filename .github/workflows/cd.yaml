name: CD

on:
  push:
    branches:
      - pingcap
  pull_request:
    branches:
      - pingcap
    paths:
      - .github/workflows/cd.yaml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  GO_VERSION: '1.24'
  DOCKER_BUILDX_VERSION: 'v0.8.2'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install goimports
        run: go install golang.org/x/tools/cmd/goimports

      - name: Find the Go Build Cache
        id: go
        run: echo "cache=$(make go.cachedir)" >> $GITHUB_OUTPUT

      - name: Cache the Go Build Cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.go.outputs.cache }}
          key: ${{ runner.os }}-build-cd-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-build-cd-

      - name: Cache Go Dependencies
        uses: actions/cache@v4
        with:
          path: .work/pkg
          key: ${{ runner.os }}-pkg-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-pkg-

      - name: Update submodules
        run: make submodules

      - name: Load build vars
        id: build_vars
        shell: bash
        run: |
          make_db="$(mktemp)"
          make -pn > "${make_db}" 2>/dev/null

          get_make_var() {
            local key="$1"
            awk -F' = ' -v key="${key}" '$1 == key { print $2; exit }' "${make_db}"
          }

          echo "up=$(make build.vars | sed -n 's/^UP=//p')" >> "${GITHUB_OUTPUT}"
          echo "terraform_version=$(get_make_var TERRAFORM_VERSION)" >> "${GITHUB_OUTPUT}"
          echo "terraform_provider_source=$(get_make_var TERRAFORM_PROVIDER_SOURCE)" >> "${GITHUB_OUTPUT}"
          echo "terraform_provider_version=$(get_make_var TERRAFORM_PROVIDER_VERSION)" >> "${GITHUB_OUTPUT}"
          echo "terraform_provider_download_name=$(get_make_var TERRAFORM_PROVIDER_DOWNLOAD_NAME)" >> "${GITHUB_OUTPUT}"
          echo "terraform_provider_download_url_prefix=$(get_make_var TERRAFORM_PROVIDER_DOWNLOAD_URL_PREFIX)" >> "${GITHUB_OUTPUT}"
          echo "terraform_native_provider_binary=$(get_make_var TERRAFORM_NATIVE_PROVIDER_BINARY)" >> "${GITHUB_OUTPUT}"
          rm -f "${make_db}"

      - name: Generate
        run: make generate

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: ${{ env.DOCKER_BUILDX_VERSION }}
          install: true

      - name: Build
        run: make -j2 build.all
        env:
          # Keep CD aligned with CI so both provider architectures exist
          # before the multi-arch image build runs.
          BUILD_ARGS: "--load"

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=pingcap-
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Crossplane provider for AlibabaCloud

      - name: Verify xpkg artifact
        if: github.event_name != 'push'
        run: |
          ls -1 _output/xpkg/linux_amd64/provider-upjet-alibabacloud-*.xpkg
          ls -1 _output/xpkg/linux_arm64/provider-upjet-alibabacloud-*.xpkg

      - name: Prepare Docker build context
        run: |
          rm -rf .work/docker-context
          mkdir -p .work/docker-context
          cp cluster/images/provider-upjet-alibabacloud/Dockerfile .work/docker-context/Dockerfile
          cp cluster/images/provider-upjet-alibabacloud/terraformrc.hcl .work/docker-context/terraformrc.hcl
          cp -r _output/bin .work/docker-context/bin

      - name: Build and push xpkg
        if: github.event_name == 'push'
        run: |
          "${{ steps.build_vars.outputs.up }}" xpkg push \
            --package _output/xpkg/linux_amd64/provider-upjet-alibabacloud-*.xpkg \
            --package _output/xpkg/linux_arm64/provider-upjet-alibabacloud-*.xpkg \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${GITHUB_SHA:0:8}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .work/docker-context
          file: .work/docker-context/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            TERRAFORM_VERSION=${{ steps.build_vars.outputs.terraform_version }}
            TERRAFORM_PROVIDER_SOURCE=${{ steps.build_vars.outputs.terraform_provider_source }}
            TERRAFORM_PROVIDER_VERSION=${{ steps.build_vars.outputs.terraform_provider_version }}
            TERRAFORM_PROVIDER_DOWNLOAD_NAME=${{ steps.build_vars.outputs.terraform_provider_download_name }}
            TERRAFORM_PROVIDER_DOWNLOAD_URL_PREFIX=${{ steps.build_vars.outputs.terraform_provider_download_url_prefix }}
            TERRAFORM_NATIVE_PROVIDER_BINARY=${{ steps.build_vars.outputs.terraform_native_provider_binary }}
